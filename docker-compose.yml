# WheyProof runs on the SAME VM as the Turkish site (Protein Avcısı). Only one
# process can listen on 80/443, and that is the Turkish stack's Caddy container.
# So this stack has NO Caddy and publishes NO host ports:
#   - the Turkish Caddy imports caddy/sites/*.caddy from this repo and proxies
#     WheyProof's hosts over the shared external network "web-edge";
#   - on that network the containers answer to "wheyproof-backend" and
#     "wheyproof-frontend". The SERVICES are named that way on purpose: Compose
#     adds the service name as an alias on EVERY network a service joins, and
#     that alias can't be removed. With services called "backend"/"frontend"
#     (measured on the VM: aliases "backend,wheyproof-backend") the Turkish
#     Caddy, which proxies to "backend:8080" on its own network, would also see
#     WheyProof's "backend" on web-edge and could route Turkish traffic to it.
#
# One-time setup on the VM: docker network create web-edge
name: wheyproof

services:
  # initdb arguments match the Turkish database (builtin locale C.UTF-8): a
  # different collation would silently change text ordering and index layout.
  db:
    # Not alpine on purpose: musl has limited locale support, "C.UTF-8" isn't
    # available there and initdb silently falls back to another locale.
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=wheyproof
      - POSTGRES_USER=wheyproof
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    # No host port: the Turkish database already binds 127.0.0.1:5432, and a
    # second binding would stop this container from starting. Reach it with
    # `docker compose exec db psql -U wheyproof -d wheyproof`.
    expose:
      - "5432"
    # Postgres treats SIGTERM as "smart shutdown" and waits for clients until
    # Docker's SIGKILL, which forces recovery on the next start. SIGINT is a
    # fast shutdown.
    stop_signal: SIGINT
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheyproof -d wheyproof"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Postgres 18 writes data to a version-specific subdirectory, so the volume
    # is mounted one level up; the old /var/lib/postgresql/data path makes the
    # container refuse to start.
    volumes:
      - pg_data:/var/lib/postgresql

  wheyproof-backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      # The output cache key includes the Host; without this, warming fills a
      # "localhost" key no visitor uses.
      - OutputCache__WarmupHost=api.wheyproof.com
      - ConnectionStrings__Default=${CONNECTION_STRING}
      - AdminApiKey=${ADMIN_API_KEY}
      # The admin panel sits behind Cloudflare Access; the backend also accepts
      # Access's signed identity token. UNLESS BOTH ARE SET this path is fully
      # CLOSED, so a half configuration can't silently open the door.
      - CloudflareAccess__TeamDomain=${CF_ACCESS_TEAM_DOMAIN:-}
      - CloudflareAccess__Aud=${CF_ACCESS_AUD:-}
      - Health__StaleHours=${HEALTH_STALE_HOURS:-26}
      - Brevo__ApiKey=${BREVO_API_KEY}
      - Brevo__SenderEmail=${BREVO_SENDER_EMAIL:-newsletter@wheyproof.com}
      # IndexNow key; not secret, it is published at /{key}.txt.
      - IndexNow__Key=${INDEXNOW_KEY}
      # Affiliate link rules, one per STORE HOST (not brand: Bodybuilding.com
      # sells other brands and pays its own commission). Link is either a query
      # pair (UpPromote, Refersion) or a redirect template with {url} (Awin, CJ,
      # Impact, Sovrn); values live in .env. A store without a Link keeps its
      # URL unchanged.
      # NO DOTS IN THESE VARIABLE NAMES: Affiliate__Links__transparentlabs.com
      # reached the container but not the app's configuration (0 rules loaded).
      # The host goes in the value instead. New stores take the next index.
      # Sovrn Commerce (one publisher key, redirect.viglink.com?key=...&u={url}):
      - Affiliate__Rules__0__Host=transparentlabs.com
      - Affiliate__Rules__0__Link=${AFFILIATE_TRANSPARENTLABS:-}
      - Affiliate__Rules__1__Host=questnutrition.com
      - Affiliate__Rules__1__Link=${AFFILIATE_QUESTNUTRITION:-}
      - Affiliate__Rules__2__Host=promixnutrition.com
      - Affiliate__Rules__2__Link=${AFFILIATE_PROMIXNUTRITION:-}
      - Affiliate__Rules__3__Host=orgain.com
      - Affiliate__Rules__3__Link=${AFFILIATE_ORGAIN:-}
      - PublicBaseUrl=https://api.wheyproof.com
      - FrontendBaseUrl=https://www.wheyproof.com
      # Product images are resized and served by .NET, not Caddy (see Program.cs).
      - ProductImages__Enabled=true
      - ProductImages__StoragePath=/app/product-images
      - ProductImages__PublicBaseUrl=https://api.wheyproof.com/api/images
      - Cors__AllowedOrigins__0=https://wheyproof.com
      - Cors__AllowedOrigins__1=https://www.wheyproof.com
      - Scraping__Enabled=true
      # DIGEST IS OFF until the newsletter footer has a physical postal address:
      # CAN-SPAM requires one in every commercial email. Subscription
      # confirmations and price alerts still send; flip this to true once the
      # address is in place.
      - Digest__Enabled=false
      # The postal address the footer prints. The digest also refuses to send
      # while this is empty (DigestService), so switching Digest__Enabled on
      # without an address can't break CAN-SPAM. Value lives in .env.
      - Newsletter__PostalAddress=${NEWSLETTER_POSTAL_ADDRESS:-}
      # Nutrition facts read from the stores' label images. Engine "tesseract"
      # is free OCR inside this container (calorie-checked Nutrition Facts only);
      # "claude" is the paid vision API and needs ANTHROPIC_API_KEY. The background
      # job is ON since the 2026-09-14 live pilot: every accepted reading (9 of 9,
      # checked against the images) was right. The pilot endpoint still reads
      # without writing, for spot checks.
      - NutritionLabels__Engine=${NUTRITION_LABELS_ENGINE:-tesseract}
      - NutritionLabels__ApiKey=${ANTHROPIC_API_KEY:-}
      - NutritionLabels__Enabled=${NUTRITION_LABELS_ENABLED:-true}
      - NutritionLabels__Model=${NUTRITION_LABELS_MODEL:-claude-haiku-4-5-20251001}
      - DescriptionBackfill__Enabled=true
    expose:
      - "8080"
    # Named volume so a deploy doesn't download every image again.
    volumes:
      - product_images:/app/product-images
    networks:
      - default
      - web-edge
    # Migrations run at startup, so the database must be ready first.
    depends_on:
      db:
        condition: service_healthy

  wheyproof-frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - PORT=4000
      # Angular SSR rejects requests for hosts not listed here.
      - NG_ALLOWED_HOSTS=wheyproof.com,www.wheyproof.com
    expose:
      - "4000"
    networks:
      - default
      - web-edge
    depends_on:
      - wheyproof-backend

networks:
  # Created once on the VM and shared with the Turkish stack's Caddy.
  web-edge:
    external: true

volumes:
  product_images:
  pg_data:
