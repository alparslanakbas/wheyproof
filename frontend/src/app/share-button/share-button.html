<div class="relative inline-block">
  <button
    type="button"
    title="Paylaş"
    (click)="onShareClick()"
    class="flex h-9 w-9 items-center justify-center rounded-full border border-stone-200 text-stone-500 transition-colors hover:border-brand-300 hover:text-brand-700 dark:border-stone-700 dark:text-stone-400 dark:hover:border-brand-500 dark:hover:text-brand-400"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4">
      <circle cx="18" cy="5" r="3" />
      <circle cx="6" cy="12" r="3" />
      <circle cx="18" cy="19" r="3" />
      <path stroke-linecap="round" d="M8.6 10.5 15.4 6.5M8.6 13.5 15.4 17.5" />
    </svg>
  </button>

  @if (menuOpen()) {
    <div class="fixed inset-0 z-40" (click)="closeMenu()"></div>

    <div
      class="absolute right-0 z-50 mt-2 w-52 overflow-hidden rounded-xl border border-stone-200 bg-white shadow-lg dark:border-stone-700 dark:bg-stone-900"
      (click)="$event.stopPropagation()"
    >
      <a
        [href]="whatsappUrl()"
        target="_blank"
        rel="noopener"
        class="flex items-center gap-2.5 px-3.5 py-2.5 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-200 dark:hover:bg-stone-800"
        (click)="closeMenu()"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4 text-[#25D366]">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.28-1.38a9.9 9.9 0 0 0 4.76 1.21h.01c5.46 0 9.9-4.45 9.9-9.9C21.96 6.45 17.5 2 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3.13.82.84-3.05-.2-.31a8.2 8.2 0 0 1-1.26-4.4c0-4.53 3.69-8.22 8.25-8.22 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.42 5.82c0 4.54-3.7 8.25-8.25 8.25Zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.4-.12-.56.13-.17.25-.65.81-.8.97-.15.17-.3.19-.55.06-.25-.12-1.05-.39-2-1.23a7.5 7.5 0 0 1-1.38-1.72c-.15-.25-.02-.38.11-.5.11-.11.25-.3.37-.44.12-.15.16-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.87.85-.87 2.08 0 1.22.89 2.4 1.01 2.57.12.17 1.75 2.67 4.24 3.75.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.16-.48-.28Z" />
        </svg>
        WhatsApp
      </a>
      <a
        [href]="twitterUrl()"
        target="_blank"
        rel="noopener"
        class="flex items-center gap-2.5 px-3.5 py-2.5 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-200 dark:hover:bg-stone-800"
        (click)="closeMenu()"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4">
          <path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.1l-5.6-6.7L4.2 22H1l8.1-9.3L0.9 2H8.2l5 6.1L18.9 2Zm-1.2 18h1.7L6.4 4H4.6l13.1 16Z" />
        </svg>
        X (Twitter)
      </a>
      <a
        [href]="facebookUrl()"
        target="_blank"
        rel="noopener"
        class="flex items-center gap-2.5 px-3.5 py-2.5 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-200 dark:hover:bg-stone-800"
        (click)="closeMenu()"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4 text-[#1877F2]">
          <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94Z" />
        </svg>
        Facebook
      </a>
      <button
        type="button"
        (click)="copyLink()"
        class="flex w-full items-center gap-2.5 border-t border-stone-100 px-3.5 py-2.5 text-left text-sm text-stone-700 hover:bg-stone-50 dark:border-stone-800 dark:text-stone-200 dark:hover:bg-stone-800"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12a3 3 0 0 0 4.24.2l3-3a3 3 0 0 0-4.24-4.24l-1.72 1.71" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 0 0-4.24-.2l-3 3a3 3 0 0 0 4.24 4.24l1.71-1.71" />
        </svg>
        {{ copied() ? 'Kopyalandı!' : 'Linki Kopyala' }}
      </button>
    </div>
  }
</div>
