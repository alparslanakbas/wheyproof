@if (consent.status() === null) {
  <div class="noc-shell fixed inset-x-0 bottom-[66px] z-40 px-3 pb-3 text-[var(--noc-text)] sm:bottom-0 sm:px-6">
    <div class="pa-card mx-auto flex max-w-[960px] flex-col items-center gap-3 px-4 py-3 shadow-[var(--noc-shadow-lg)] sm:flex-row sm:justify-between">
      <p class="text-center text-xs text-[var(--noc-neutral-500)] sm:text-left">
        Yalnızca tema ve çerez tercihini cihazında saklıyoruz. Ziyaretçi sayımız çerezsiz ve
        kimseyi tanımlamıyor. Reklam çerezi eklenirse bu seçimine uyacağız.
        <a routerLink="/cerez-politikasi" class="font-medium text-[var(--noc-accent)] hover:underline">
          Çerez Politikası
        </a>
      </p>
      <div class="flex shrink-0 items-center gap-2">
        <button
          type="button"
          (click)="consent.reject()"
          class="pa-secondary-button px-4 py-2 text-xs"
        >
          Reddet
        </button>
        <button
          type="button"
          (click)="consent.accept()"
          class="pa-primary-button px-4 py-2 text-xs"
        >
          Kabul Et
        </button>
      </div>
    </div>
  </div>
}
