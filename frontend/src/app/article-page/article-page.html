<div class="noc-shell min-h-screen bg-[var(--noc-bg)] text-[var(--noc-text)]">
  <app-site-header />

  <main class="mx-auto max-w-[720px] px-[28px] py-[22px]">
    @if (loading()) {
      <div class="py-24 text-center text-[var(--noc-neutral-500)]">Yükleniyor...</div>
    } @else if (article(); as a) {
      <a routerLink="/rehber" class="mb-4 inline-block text-xs font-medium text-[var(--noc-neutral-500)] hover:text-[var(--noc-accent)]">← Rehber</a>

      <h1 class="text-[32px] font-medium tracking-[-0.03em] sm:text-[36px]">{{ a.title }}</h1>
      <p class="mt-2 text-xs text-[var(--noc-neutral-500)]">{{ a.publishedAt | date:'d MMMM yyyy':'':'tr' }}</p>

      @if (a.coverImageUrl) {
        <div class="mt-6 aspect-[2/1] overflow-hidden rounded-[14px] bg-[color-mix(in_srgb,var(--noc-text)_5%,transparent)]">
          <img [src]="a.coverImageUrl" [alt]="a.title" class="h-full w-full object-cover" />
        </div>
      }

      <article
        class="prose prose-stone dark:prose-invert prose-headings:font-medium prose-a:text-[var(--noc-accent)] mt-8 max-w-none"
        [innerHTML]="a.body"
      ></article>

      <div class="mt-10 border-t border-[var(--noc-divider)] pt-6 text-center">
        <a routerLink="/" class="text-sm font-medium text-[var(--noc-accent)]">Tüm indirimleri gör →</a>
      </div>
    }
  </main>
</div>
