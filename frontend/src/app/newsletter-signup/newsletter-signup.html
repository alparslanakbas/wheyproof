<div class="mx-auto max-w-sm text-center">
  <p class="mb-2 text-[11px] font-medium uppercase tracking-[0.1em] text-[var(--noc-neutral-500)]">
    Get the best price drops by email
  </p>
  <form (ngSubmit)="onSubscribe()" class="flex gap-2">
    <!-- Honeypot: hidden from screen readers and keyboard navigation too, so a
         real visitor never meets it. Bots fill every field, so a value here
         marks the request as automated. It is moved off-screen rather than
         display:none because some bots skip hidden fields. -->
    <input
      type="text"
      name="website"
      autocomplete="off"
      tabindex="-1"
      aria-hidden="true"
      [ngModel]="website()"
      (ngModelChange)="website.set($event)"
      class="absolute left-[-9999px] h-0 w-0 opacity-0"
    />
    <input
      type="email"
      name="email"
      required
      placeholder="Your email address"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      class="min-w-0 flex-1 rounded-[8px] border border-[var(--noc-divider)] bg-[var(--noc-surface)] px-3 py-1.5 text-xs text-[var(--noc-text)] placeholder:text-[var(--noc-neutral-500)] focus:border-[var(--noc-accent)] focus:outline-none"
    />
    <button
      type="submit"
      [disabled]="submitting()"
      class="shrink-0 rounded-[8px] border border-[var(--noc-accent)] px-4 py-1.5 text-xs font-medium text-[var(--noc-accent)] transition-colors hover:bg-[color-mix(in_srgb,var(--noc-accent)_12%,transparent)] disabled:cursor-not-allowed disabled:opacity-60"
    >
      Subscribe
    </button>
  </form>
  @if (statusMessage(); as message) {
    <p
      class="mt-2 text-xs"
      [class]="statusIsError() ? 'text-red-500 dark:text-red-400' : 'text-[var(--noc-accent)]'"
    >
      {{ message }}
    </p>
  }
</div>
