<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Real Supplement Deals, Checked Against Price History | WheyProof</title>
  <meta name="description" content="WheyProof tracks protein powder, creatine, pre-workout and other supplement prices every day and shows which discounts are real, based on price history rather than the store's own &quot;was&quot; price.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WheyProof">
  <meta property="og:title" content="WheyProof | Supplement Price Tracker and Real Deals">
  <meta property="og:description" content="Protein powder, creatine and pre-workout prices tracked daily. See which discounts are real, based on price history.">
  <!-- Default share card for pages without their own image (a product photo,
       for example). Page code replaces or removes this tag, so no page is
       shared with an empty card. -->
  <meta property="og:image" content="https://www.wheyproof.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#796cbf">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script>
    // Apply the theme before Angular loads so the wrong theme never flashes.
    // ThemeService applies the same rule in JS; this only gets the first
    // paint right.
    (function () {
      var stored = localStorage.getItem('theme-preference');
      var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
