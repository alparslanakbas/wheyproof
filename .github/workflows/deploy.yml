name: Deploy to Oracle VM

on:
  push:
    branches: [main]

# Two deploys must not run at once; a second push queues instead of cancelling a
# deploy halfway, which would be worse than finishing the old one.
concurrency:
  group: deploy-wheyproof
  cancel-in-progress: false

# The test jobs read the repository, the deploy job is SSH only: narrowest
# token scope.
permissions:
  contents: read

jobs:
  # TEST GATE: deploy starts only after both test jobs pass. Before, a push
  # went straight to production and failures of the "every endpoint answers
  # 500" kind were only seen live (security review, 2026-09-25). The actions
  # are pinned to commit SHAs like the deploy step.
  backend-test:
    runs-on: ubuntu-latest
    # Real PostgreSQL: DealsQueryService's bugs show up at SQL translation
    # (this class took the Turkish site down twice), which in-memory tests
    # can't see. initdb settings match production (builtin / C.UTF-8): a
    # different collation silently changes text ordering.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wheyproof_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB: Host=localhost;Port=5432;Database=wheyproof_test;Username=postgres;Password=test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # The test PROJECT path: given the solution file (.slnx), dotnet test
      # ran no tests and still reported success (measured), which would make
      # the gate a false comfort.
      - run: dotnet test backend/tests/IndirimTakip.Infrastructure.Tests/IndirimTakip.Infrastructure.Tests.csproj

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false

  # Split large files must not grow back (security review B5, 26 Sept).
  # The limit and the frozen ceilings live in the script.
  size-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/size-limit.sh

  deploy:
    needs: [backend-test, frontend-test, size-limit]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # A commit SHA, not a tag: a tag can be moved to other code later (the
        # tj-actions incident) and this step sees the production SSH key.
        # SHA = v1.0.3, `git ls-remote https://github.com/appleboy/ssh-action refs/tags/v1.0.3`.
        # Host key fingerprint deliberately NOT set: the server offers three key
        # types and which one the action picks is unclear; the wrong one would
        # fail every deploy (security review, 2026-09-25).
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          # On the server this key can ONLY run the deploy gate
          # (authorized_keys: restrict,command="/usr/local/bin/deploy-kapisi wheyproof").
          # The gate rejects every command but "deploy"; it updates the checkout
          # and runs scripts/deploy.sh, where the steps now live (they were
          # written here until 27 Sept). The gate is kept in the Turkish repo as
          # scripts/deploy-kapisi.sh, with the reasoning.
          script: deploy
